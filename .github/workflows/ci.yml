name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permissions
        run: chmod +x gradlew run_focused_tests.sh

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Focused Unit Tests
        run: ./run_focused_tests.sh

      # Everything above this runs against the `full` flavour only: `lint` lints the
      # default variant, and the unit tests compile the flavour they run in. Assembling
      # builds both, so the grocery build's manifest merge and resources are checked by
      # CI rather than by whoever next installs it.
      - name: Assemble both flavours
        run: ./gradlew assembleDebug
