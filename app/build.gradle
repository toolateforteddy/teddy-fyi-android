import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.gitlab.arturbosch.detekt'
}

android {
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    namespace 'fyi.teddy.android'
    compileSdk 37

    defaultConfig {
        applicationId "fyi.teddy.android"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Two apps out of one tree. `full` is Teddy FYI as it has always been — Todo and Grocery
    // side by side. `grocery` is the grocery list on its own, for a tablet left on a kitchen
    // counter for somebody who has no reason to see anybody's todo list. It carries its own
    // applicationId so both can sit on one device, and the shared sync layer means the two
    // installs are the same lists, not copies.
    flavorDimensions += "surface"

    productFlavors {
        full {
            dimension "surface"
            // Which app is asking, for /auth/device/start. The API answers with the page the
            // code is redeemed on, and it keys that off this string — see APP_VERIFICATION_URIS
            // in teddy-fyi-api-rust. A value it does not know sends people to somebody else's
            // site, so this is not a free-form label.
            buildConfigField "String", "PAIRING_APP", '"TEDDY_FYI"'
            buildConfigField "boolean", "INCLUDE_TODO", "true"
        }
        grocery {
            dimension "surface"
            applicationIdSuffix ".grocery"
            versionNameSuffix "-grocery"
            buildConfigField "String", "PAIRING_APP", '"TEDDY_FYI_GROCERY"'
            buildConfigField "boolean", "INCLUDE_TODO", "false"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
        // PAIRING_APP and INCLUDE_TODO below are read from Kotlin, so BuildConfig has to exist.
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

tasks.withType(Test).configureEach {
    maxParallelForks = Math.max(1, (Runtime.runtime.availableProcessors() / 2).intValue())
    maxHeapSize = '2048m'
    outputs.cacheIf { true }
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

detekt {
    buildUponDefaultConfig = true
    autoCorrect = true
    // Pre-existing findings live in the baseline; anything new fails the build so CI
    // green actually means "no new Detekt issues".
    ignoreFailures = false
    baseline = file("$projectDir/detekt-baseline.xml")
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    implementation 'io.ktor:ktor-client-core:3.5.1'
    implementation 'io.ktor:ktor-client-okhttp:3.5.1'
    implementation 'io.ktor:ktor-client-content-negotiation:3.5.1'
    implementation 'io.ktor:ktor-client-auth:3.5.1'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    testImplementation 'io.ktor:ktor-client-mock:3.5.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    testImplementation 'androidx.work:work-testing:2.11.2'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation("io.coil-kt:coil-compose:2.7.0")
    implementation("nl.dionsegijn:konfetti-compose:2.0.5")
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.google.android.gms:play-services-base:18.10.0'
    
    // Jetpack Glance for Widgets. Only the full build has widgets — the grocery build runs on a
    // Fire tablet, whose launcher hosts none — so Glance is scoped to that flavour and stays out
    // of the grocery APK.
    fullImplementation 'androidx.glance:glance-appwidget:1.1.1'
    fullImplementation 'androidx.glance:glance-material3:1.1.1'
    
    // On-device AI (SLM)
    implementation "com.google.mediapipe:tasks-genai:0.10.35"
    
    // Room
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'app.cash.turbine:turbine:1.2.1'
    testImplementation 'io.mockk:mockk:1.14.11'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation "androidx.room:room-testing:$room_version"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
